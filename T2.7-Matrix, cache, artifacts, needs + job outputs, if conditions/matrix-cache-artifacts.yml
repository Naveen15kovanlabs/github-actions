name: Matrix, Cache, and Artifacts Practice

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test matrix
        type: boolean
        default: true
        required: true
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/matrix-cache-artifacts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/matrix-cache-artifacts.yml"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare test matrix
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.matrix.outputs.python_versions }}
    steps:
      - name: Set supported Python versions
        id: matrix
        run: echo 'python_versions=["3.11","3.12"]' >> "$GITHUB_OUTPUT"

  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and restore pip cache
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project dependencies
        run: |
          start=$SECONDS
          python -m pip install -r requirements.txt ".[dev]"
          echo "Dependency install elapsed: $((SECONDS - start))s"
          echo "Pip cache hit: ${{ steps.setup-python.outputs.cache-hit }}"

      - name: Run Ruff
        run: python -m ruff check .

  test:
    name: Test with Python ${{ matrix.python-version }}
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.prepare.outputs.python_versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and restore pip cache
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project dependencies
        run: |
          start=$SECONDS
          python -m pip install -r requirements.txt ".[dev]"
          echo "Dependency install elapsed: $((SECONDS - start))s"
          echo "Pip cache hit: ${{ steps.setup-python.outputs.cache-hit }}"

      - name: Create test report directory
        run: mkdir -p test-reports

      - name: Run root project tests
        working-directory: src
        env:
          PYTHONPATH: ..
        run: >-
          python -m pytest -c ../pyproject.toml ../tests
          --ignore=../tests/test_analyzer.py
          --import-mode=importlib
          --junitxml=../test-reports/project-tests.xml
          -v

      - name: Run root incident analyzer tests
        run: >-
          python -m pytest --noconftest tests/test_analyzer.py
          --junitxml=test-reports/analyzer-tests.xml
          -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: test-reports/*.xml
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Summarize workflow results
    needs:
      - lint
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Lint result: ${LINT_RESULT}"
          echo "Test result: ${TEST_RESULT}"
          if [ "${LINT_RESULT}" != "success" ]; then
            exit 1
          fi
          if [ "${TEST_RESULT}" != "success" ] && [ "${TEST_RESULT}" != "skipped" ]; then
            exit 1
          fi
